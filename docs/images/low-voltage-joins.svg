<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 470" width="1030" height="470">
<title>ESP32 GND and 3.3V go to the breadboard's minus and plus rails. The MAX6675 sits in five breadboard columns: its GND and VCC columns jump to the rails, and ESP32 IO18, IO16 and IO19 go to its SCK, CS and SO columns. The screen's pin 1 goes to the plus rail, pin 7 to the minus rail and pin 3 to the SCK column; its pins 2, 4 and 5 go straight to ESP32 IO17, IO23 and IO4, and pin 6 stays empty.</title>
<style>
:root {
  --bg: #f2f5f3; --panel: #ffffff; --ink: #15302a; --muted: #56706a; --faint: #9aaba5; --line: #cdd8d3;
  --copper: #a8551f; --warn: #c0331d; --warn-wash: #fbe9e5;
  --pcb: #dbe6f4; --pcb-edge: #2a5ca8; --bb: #f7f8f6; --bb-edge: #c3ccc8; --hole: #aab6b1; --gap: #e3e8e6;
  --other: #9aa7a2;
  --n-gnd: #3b4651; --n-pwr: #d1382c; --n-sck: #b97700; --n-cs: #2563c9;
  --n-so: #1d8a50; --n-ocs: #7b45c9; --n-mosi: #0b8792; --n-dc: #c23a78;
  --m-live: #c62828; --m-neu: #1f262b; --m-earth: #8a949b; --v5: #c97a00; --probe: #0b8792;
  --zone-m: #fbeeea; --zone-l: #eaf1f9;
  --font-display: "Arial Narrow", "Liberation Sans Narrow", sans-serif;
  --font-body: system-ui, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "DejaVu Sans Mono", Menlo, monospace;
}
svg text { font-family: var(--font-body); fill: var(--ink); }
svg .t-xs { font-size: 10px; fill: var(--muted); font-family: var(--font-mono); }
svg .t-s { font-size: 11.5px; fill: var(--muted); }
svg .t-hd { font: 600 12px var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; fill: var(--copper); }
svg .t-row { font: 500 11px var(--font-mono); fill: var(--faint); }
svg .t-pin { font-family: var(--font-mono); font-size: 12.5px; }
svg .t-pin.on { font-weight: 600; fill: var(--ink); }
svg .t-pin.other { fill: var(--muted); }
svg .t-pin.off { fill: var(--faint); }
svg .pcb { fill: var(--pcb); stroke: var(--pcb-edge); stroke-width: 1.5; }
svg .usb { fill: var(--panel); stroke: var(--ink); stroke-width: 1.5; }
svg .pin-on { stroke: var(--panel); stroke-width: 2.5; }
svg .pin-other { fill: var(--other); }
svg .pin-off { fill: var(--pcb); stroke: var(--faint); stroke-width: 1.5; }
svg .bb { fill: var(--bb); stroke: var(--bb-edge); stroke-width: 1.5; }
svg .hole { fill: var(--hole); }
svg .gap { fill: var(--gap); }
svg .stripe { stroke-width: 2; fill: none; }
svg .colmark { opacity: 0.2; }
svg .mod { fill: var(--panel); stroke: var(--ink); stroke-width: 1.5; }
svg .leg { stroke: var(--ink); stroke-width: 3; }
svg .legtip { fill: var(--ink); }
svg .t-modpin { font: 600 11px var(--font-mono); }
svg .t-mod { font: 700 16px var(--font-display); }
svg .probe { fill: none; stroke: var(--muted); stroke-width: 3; stroke-linecap: round; }
svg .w { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
svg .hdr { fill: var(--panel); stroke: var(--ink); stroke-width: 1.5; }
svg .hdrdiv { stroke: var(--line); stroke-width: 1; }
svg .t-hn { font: 600 10px var(--font-mono); }
svg .t-hl { font: 500 9px var(--font-mono); fill: var(--muted); }
svg .t-lab { font: 700 15px var(--font-display); }
svg .tag { fill: var(--panel); stroke-width: 2; }
svg .t-tag { font: 600 14px var(--font-mono); }
svg .t-where { font-size: 11px; fill: var(--muted); }
svg .zm { fill: var(--zone-m); }
svg .zl { fill: var(--zone-l); }
svg .t-zone { font: 600 12px var(--font-mono); letter-spacing: 0.08em; }
svg .zm-t { fill: var(--m-live); }
svg .zl-t { fill: var(--n-cs); }
svg .mw { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
svg .mw.opt { stroke-dasharray: 7 6; stroke-width: 3; }
svg .c-live { stroke: var(--m-live); }
svg .c-neu { stroke: var(--m-neu); }
svg .c-earth { stroke: var(--m-earth); }
svg .c-5v { stroke: var(--v5); }
svg .c-gnd { stroke: var(--n-gnd); }
svg .c-probe { stroke: var(--probe); }
svg .d-live { fill: var(--m-live); }
svg .d-neu { fill: var(--m-neu); }
svg .d-earth { fill: var(--m-earth); }
svg .d-5v { fill: var(--v5); }
svg .d-gnd { fill: var(--n-gnd); }
svg .d-probe { fill: var(--probe); }
svg .wago { fill: var(--panel); stroke-width: 2.5; }
svg .wago.live { stroke: var(--m-live); }
svg .wago.neu { stroke: var(--m-neu); }
svg .wago.v5 { stroke: var(--v5); }
svg .t-ok { font: 500 11px var(--font-mono); fill: var(--muted); }
svg .screw { fill: var(--panel); stroke: var(--m-earth); stroke-width: 2; }
svg .w.n-gnd, svg .stripe.n-gnd, svg .tag.n-gnd { stroke: var(--n-gnd); }
svg .w.n-pwr, svg .stripe.n-pwr, svg .tag.n-pwr { stroke: var(--n-pwr); }
svg .w.n-sck, svg .tag.n-sck { stroke: var(--n-sck); }
svg .w.n-cs, svg .tag.n-cs { stroke: var(--n-cs); }
svg .w.n-so, svg .tag.n-so { stroke: var(--n-so); }
svg .w.n-ocs, svg .tag.n-ocs { stroke: var(--n-ocs); }
svg .w.n-mosi, svg .tag.n-mosi { stroke: var(--n-mosi); }
svg .w.n-dc, svg .tag.n-dc { stroke: var(--n-dc); }
svg .n-gnd:is(circle, .colmark) { fill: var(--n-gnd); }
svg .n-pwr:is(circle, .colmark) { fill: var(--n-pwr); }
svg .n-sck:is(circle, .colmark) { fill: var(--n-sck); }
svg .n-cs:is(circle, .colmark) { fill: var(--n-cs); }
svg .n-so:is(circle, .colmark) { fill: var(--n-so); }
svg .n-ocs:is(circle) { fill: var(--n-ocs); }
svg .n-mosi:is(circle) { fill: var(--n-mosi); }
svg .n-dc:is(circle) { fill: var(--n-dc); }
</style>
